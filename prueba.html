<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumar Tazas de Leche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card {
            width: 120px;
            cursor: pointer;
        }
        .trash-icon {
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Selecciona las cartas</h2>
        <div class="card-container">
            <div class="card bg-light text-center" data-name="LN" data-tazas="2">
                <div class="card-body">LN (2tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="P(1-3)" data-tazas="2">
                <div class="card-body">P(1-3) (2tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="P(3-5)" data-tazas="2">
                <div class="card-body">P(3-5) (2tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="BG" data-tazas="2">
                <div class="card-body">BG (2tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="BI" data-tazas="1">
                <div class="card-body">BI (1tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="O" data-tazas="1">
                <div class="card-body">O (1tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="D" data-tazas="2">
                <div class="card-body">D (2tz)</div>
            </div>
            <div class="card bg-light text-center" data-name="M" data-tazas="2">
                <div class="card-body">M (2tz)</div>
            </div>
        </div>

        <h3 class="mt-5">Elementos seleccionados</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tazas</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="selected-items">
            </tbody>
            <tfoot>
                <tr>
                    <td><strong>Total Tazas</strong></td>
                    <td id="total-tazas">0</td>
                    <td></td>
                </tr>
                <tr>
                    <td><strong>Total Litros</strong></td>
                    <td id="total-litros">0</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        const selectedItems = document.getElementById('selected-items');
        const totalTazasEl = document.getElementById('total-tazas');
        const totalLitrosEl = document.getElementById('total-litros');
        let totalTazas = 0;

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const name = card.getAttribute('data-name');
                const tazas = parseInt(card.getAttribute('data-tazas'));
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${name}</td>
                    <td>${tazas}</td>
                    <td><span class="trash-icon">&#128465;</span></td>
                `;
                
                // Eliminar elemento al hacer clic en el icono de basurero
                row.querySelector('.trash-icon').addEventListener('click', () => {
                    row.remove();
                    totalTazas -= tazas;
                    updateTotals();
                });

                selectedItems.appendChild(row);
                totalTazas += tazas;
                updateTotals();
            });
        });

        function updateTotals() {
            totalTazasEl.textContent = totalTazas;
            totalLitrosEl.textContent = (totalTazas / 5).toFixed(2);
        }
    </script>
</body>
</html>
